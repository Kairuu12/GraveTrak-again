    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background-color: #f4f4f4;
            overflow: hidden;
        }
        #map {
            height: 100vh;
            width: 100%;
        }

        /* Centered Modal Panel */
        #side-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -40%);
            width: 400px;
            max-width: 90%;
            max-height: 85vh;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            padding: 24px;
            box-sizing: border-box;
            font-family: sans-serif;
            overflow-y: auto;
        }
        #side-panel.open {
            transform: translate(-50%, -50%);
            opacity: 1;
            visibility: visible;
        }
        .close-btn {
            float: right;
            cursor: pointer;
            color: #94a3b8;
            font-weight: bold;
            font-size: 20px;
            transition: color 0.2s;
        }
        .close-btn:hover {
            color: #ef4444;
        }
        #panel-content {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }
        .niche-slot {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 40px 20px;
            text-align: center;
            transition: all 0.2s;
            cursor: pointer;
        }
        .niche-slot:hover {
            border-color: #94a3b8;
            background: #f1f5f9;
        }
        .niche-slot h4 { margin: 0 0 12px 0; color: #1e293b; font-size: 20px; }
        .niche-slot p { margin: 0; font-size: 14px; color: #64748b; }
        .status-badge {
            display: inline-block;
            padding: 8px 16px;
            background: #dcfce7;
            color: #166534;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }

        // Function to subdivide Section A into 84 angled and clipped grave plot polygons (2 rows x 42 columns - vertical layout)
        function generateGravePlots(sectionAPolygon) {
            const coords = sectionAPolygon.coordinates[0];
            
            const get2D = (c) => [c[0], c[1]];
            const p0 = get2D(coords[0]); 
            const p1 = get2D(coords[1]); 
            const p2 = get2D(coords[2]); 
            const p3 = get2D(coords[3]); 
            
            const topEdge = turf.lineString([p0, p1]);
            const bottomEdge = turf.lineString([p3, p2]);

            const cols = 42;
            const topLength = turf.length(topEdge, {units: 'meters'});
            const bottomLength = turf.length(bottomEdge, {units: 'meters'});
            
            const topStep = topLength / cols;
            const bottomStep = bottomLength / cols;
            
            const topPts = [];
            const bottomPts = [];
            const centerPts = [];
            
            for (let i = 0; i <= cols; i++) {
                const tPt = turf.along(topEdge, i * topStep, {units: 'meters'}).geometry.coordinates;
                const bPt = turf.along(bottomEdge, i * bottomStep, {units: 'meters'}).geometry.coordinates;
                
                topPts.push(tPt);
                bottomPts.push(bPt);
                
                const cPt = turf.midpoint(turf.point(tPt), turf.point(bPt)).geometry.coordinates;
                centerPts.push(cPt);
            }
            
            const gravePlots = [];
            
            for (let i = 0; i < cols; i++) {
                const topPlot = turf.polygon([[
                    topPts[i],
                    topPts[i+1],
                    centerPts[i+1],
                    centerPts[i],
                    topPts[i]
                ]], {
                    "plotNumber": i + 1,
                    "side": "Top",
                    "name": `Plot A-Top-${i + 1}`,
                    "section": "A",
                    "row": 1,
                    "column": i + 1
                });
                gravePlots.push(topPlot);
                
                const bottomPlot = turf.polygon([[
                    centerPts[i],
                    centerPts[i+1],
                    bottomPts[i+1],
                    bottomPts[i],
                    centerPts[i]
                ]], {
                    "plotNumber": i + 1,
                    "side": "Bottom",
                    "name": `Plot A-Bottom-${i + 1}`,
                    "section": "A",
                    "row": 2,
                    "column": i + 1
                });
                gravePlots.push(bottomPlot);
            }
            
            return {
                "type": "FeatureCollection",
                "features": gravePlots
            };
        }
    </script>

        function closePanel() {

        function openPanel(feature) {
            const props = feature.properties;
            document.getElementById('panel-title').innerHTML = props.name || "Plot Details";
            
            let nichesHTML = '';
            for(let j = 1; j <= 4; j++) {
                nichesHTML += `

            document.getElementById('side-panel').classList.add('open');

                    layer.bindPopup("<div style='font-family: sans-serif; font-size: 14px;'>Sementeryo Plot: <strong>" + feature.properties.name.toUpperCase() + "</strong></div>");

                        mouseover: function(e) { e.target.setStyle({ fillOpacity: 0.9 }); },
                        mouseout: function(e) { geojsonLayer.resetStyle(e.target); }
                    });
                }
            }
        }).addTo(map);
